label = "Terminal"
glyph = "󰕈"
turn_left_glyph = "f0141"
turn_right_glyph = "f0142"
press_glyph = "f036c"

[page.dial.turn_left]
type = "app"
command = "tmux select-window -t -1"

[page.dial.turn_right]
type = "app"
command = "tmux select-window -t +1"

[page.dial.press]
type = "script"
path = "dictation-toggle.sh"

[page.dial.release]
type = "script"
path = "dictation-stop.sh"

