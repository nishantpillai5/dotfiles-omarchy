[page.key.action]
type = "script"
path = "launch-pi.sh"

[[page.key]]
index = 2
label = "Pi cont"
glyph = "⏵"

[page.key.action]
type = "app"
command = "tmux new-window /home/noobaf/.local/bin/pi --continue"

[[page.key]]
index = 3
label = "Stop Pi"
glyph = "⏹"

[page.key.action]
type = "script"
path = "stop-pi.sh"

[[page.key]]
index = 5
label = "New Term"
glyph = "f0541"

[page.key.action]
type = "app"
command = "tmux new-window"

[[page.key]]
index = 6
label = "Close Term"
glyph = "f015c"

[page.key.action]
type = "script"
path = "tmux-kill-window.sh"

[[page.key]]
index = 7
label = "/compact"

[page.key.action]
type = "script"
path = "prompt-compact.sh"

[[page.dial]]
index = 0
label = "Source"
glyph = "󰋀"

[page.dial.turn_left]
type = "app"
command = "/home/noobaf/.config/omadeck/audio-output-switch.sh prev"

[page.dial.turn_right]
type = "app"
command = "/home/noobaf/.config/omadeck/audio-output-switch.sh next"

[page.dial.press]
type = "app"
command = "/home/noobaf/.config/omadeck/audio-output-switch.sh next"

[page.dial.live]
source = "command"
command = '''s=$(timeout 3 pactl get-default-sink 2>/dev/null); f="$s $(pactl list sinks short 2>/dev/null | cut -d' ' -f1 | tr '\n' ' ')"; c=/home/noobaf/.config/omadeck/.sink-live; if [ "$f" = "$(cat "$c.mtime" 2>/dev/null)" ] && [ -f "$c" ]; then cat "$c"; exit 0; fi; d=$(pactl -f json list sinks 2>/dev/null | jq -r --arg n "$s" '[.[] | select(.name==$n)][0] | (.description // .properties."device.description" // .name) // empty'); b=$(printf "%s\n" "$d" | grep -oE '\[[^]]+\]' | head -1 | tr -d '[]'); if [ -n "$b" ]; then out=$b; elif [ -n "$d" ]; then out=$(printf "%s\n" "$d" | cut -d' ' -f1-3); else out=None; fi; printf '%s\n' "$out" > "$c"; printf '%s\n' "$f" > "$c.mtime"; printf '%s\n' "$out"'''

[[page.dial]]
index = 1
label = "Media"

[page.dial.turn_left]
type = "media"
seek = -5

[page.dial.turn_right]
type = "media"
seek = 5

[page.dial.press]
type = "media"

[[page.dial]]
index = 2
label = "Scroll"
turn_left_glyph = "f0143"
turn_right_glyph = "f0140"

[page.dial.turn_left]
