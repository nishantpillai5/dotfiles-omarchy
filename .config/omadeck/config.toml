# omadeck configuration - edit by hand or with the `omadeck` app.

brightness = 75

[style]
follow_theme = true

[[key]]
index = 0
label = "Discord"
icon = "icons/omarchy-discord.png"

[key.action]
type = "app"
command = "omarchy launch or focus discord 'omarchy-launch-webapp https://discord.com/channels/@me'"

[[key]]
index = 1
label = "Element"
icon = "icons/io.element.Element.svg"
busy_while_running = true

[key.action]
type = "app"
command = "omarchy launch or focus element element-desktop"

[[key]]
index = 2
label = "Browser"
icon = "icons/brave-browser.png"

[key.action]
type = "app"
command = "omarchy launch browser"

[[key]]
index = 3
label = "Steam"
icon = "icons/steam.png"

[key.action]
type = "app"
command = "omarchy launch or focus steam 'steam'"

[[key]]
index = 6

[key.action]
type = "script"
path = "clock-city-toggle.sh"

[key.live]
source = "command"
command = 'c=$(cat /home/noobaf/.config/omadeck/clock-city 2>/dev/null); t=Europe/Stockholm; [ "$c" = "Delhi" ] && t=Asia/Kolkata; TZ=$t date +%H:%M; echo $c'
interval = 1

[[key]]
index = 7
label = "Dictation"
glyph = "󰍬"

[key.action]
type = "app"
command = "voxtype record start"

[key.release]
type = "script"
path = "dictation-stop.sh"

[[key]]
index = 8
label = "4"

[key.action]
type = "hyprland"
dispatch = "workspace 4"

[[key]]
index = 9
label = "5"

[key.action]
type = "hyprland"
dispatch = "workspace 5"

[[key]]
index = 10
label = "Mute"
glyph = "󰝟"

[key.action]
type = "app"
command = "omarchy audio output volume mute-toggle"

[[key]]
index = 11
label = "Night light"
glyph = "󰖔"

[key.action]
type = "app"
command = "omarchy toggle nightlight"

[[key]]
index = 12
label = "Wallpaper"
icon = "icons/preferences-desktop-wallpaper.png"

[key.action]
type = "app"
command = "omarchy theme bg next"

[[key]]
index = 13
label = "Ding!"
icon = "icons/audio-x-generic.png"

[key.action]
type = "sound"
file = "/usr/share/sounds/freedesktop/stereo/complete.oga"

[[key]]
index = 14
label = "Lock"
icon = "icons/system-lock-screen.png"

[key.action]
type = "app"
command = "omarchy system lock"

[[page]]
name = "AI agent"

[[page.key]]
index = 0
label = "LLM"
glyph = "󰚩"

[page.key.action]
type = "app"
command = "/usr/bin/magnitude models load qwen3.8-27b:gguf:q4"

[page.key.on]
label = "LLM ready"
glyph = "󰚩"
state = """s=$(tail -c 262144 /home/noobaf/.magnitude/logs/inference.log 2>/dev/null | grep "model.id=qwen3.8-27b" | grep -E "residency (transitioned|terminalized)" | grep -oE 'residency.state="[a-z]+"' | tail -1 | cut -d'"' -f2 | tr 'A-Z' 'a-z'); [ -n "$s" ] || s=$(/usr/bin/magnitude models status 2>/dev/null | awk 'NR>3 && NF {print $(NF-1); exit}' | tr 'A-Z' 'a-z'); case $s in ready) exit 0;; loading) p=$(/usr/bin/magnitude models status 2>/dev/null | awk 'NR>3 && NF { if ($(NF-1) ~ /%$/) print $(NF-2), $(NF-1); else print $(NF-1); exit }'); echo ${p:-Loading}; exit 75;; *) exit 1;; esac"""
interval = 5
slow = true

[page.key.on.action]
type = "app"
command = "/usr/bin/magnitude models stop"

[page.key.busy]
bar = true

[page.key.live]
source = "command"
command = '''l=/home/noobaf/.magnitude/logs/inference.log; m=qwen3.8-27b:gguf:q4; c=/home/noobaf/.config/omadeck/.llm-live; s=$(tail -c 262144 "$l" 2>/dev/null | grep "model.id=qwen3.8-27b" | grep -E "residency (transitioned|terminalized)" | grep -oE 'residency.state="[a-z]+"' | tail -1 | cut -d'"' -f2 | sed 's/vacant/stopped/'); if [ "$s" = 'ready' ]; then if [ "$(cat "$c" 2>/dev/null)" = "$m" ]; then cat "$c.label" 2>/dev/null || echo Ready; else /usr/bin/magnitude models status "$m" 2>/dev/null | head -1 > "$c.label"; printf '%s\n' "$m" > "$c"; cat "$c.label"; fi; else awk -v s="$s" 'BEGIN{print toupper(substr(s,1,1)) substr(s,2)}'; fi'''

[[page.key]]
index = 4
label = "OpenHands"
icon = "icons/openhands.png"

[page.key.action]
type = "app"
command = "systemctl --user start openhands-canvas"

[page.key.on]
label = "OpenHands"
icon = "icons/openhands.png"
state = "pgrep -f 'agent-[c]anvas' >/dev/null"
interval = 5
slow = true

[page.key.on.action]
type = "app"
command = "pkill -f 'agent-[c]anvas'; pkill -f 'agent-[s]erver'"


[[page.key]]
index = 1
label = "Pi"
